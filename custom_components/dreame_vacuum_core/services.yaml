rotate_to_heading:
  name: Rotate to heading
  description: >-
    Turn the vacuum on the spot until it faces a given compass heading. Runs a
    closed loop - the device only accepts relative nudges and overshoots them,
    so this measures, corrects and repeats until it is within tolerance.
  target:
    entity:
      integration: dreame_vacuum_core
      domain: vacuum
  fields:
    heading:
      name: Heading
      description: Target heading in degrees.
      required: true
      selector:
        number:
          min: 0
          max: 359
          unit_of_measurement: "°"
    tolerance:
      name: Tolerance
      description: How close counts as arrived, in degrees.
      default: 1
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: "°"
    max_attempts:
      name: Maximum attempts
      description: Give up after this many corrections and raise an error.
      default: 10
      selector:
        number:
          min: 1
          max: 20
    damping:
      name: Damping
      description: >-
        Fraction of the remaining error to correct each step. Lower is slower
        but less likely to oscillate around the target.
      default: 0.3
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.05
    settle:
      name: Settle time
      description: >-
        Seconds to wait after each nudge before measuring. The robot turns at
        its own pace, so measuring too early reads a heading it has already
        left. Scaled up automatically for larger turns.
      default: 4
      selector:
        number:
          min: 0
          max: 15
          unit_of_measurement: s
    quiet:
      name: Quiet the vacuum
      description: >-
        Turn suction and water down to their minimum for the turn, then put
        them back. The firmware treats remote driving as a cleaning mode, so
        the brushes cannot be switched off outright - only turned down.
      default: true
      selector:
        boolean:

go_to_point:
  name: Go to point
  description: >-
    Drive to a coordinate on the current map, optionally finishing on a given
    heading. Coordinates are millimetres in the map's own frame of reference
    and are only valid for the map they were read from - check map_id.
  target:
    entity:
      integration: dreame_vacuum_core
      domain: vacuum
  fields:
    x:
      name: X
      description: Target X in millimetres, as reported by position_x.
      required: true
      selector:
        number:
          min: -20000
          max: 20000
          mode: box
    y:
      name: Y
      description: Target Y in millimetres, as reported by position_y.
      required: true
      selector:
        number:
          min: -20000
          max: 20000
          mode: box
    heading:
      name: Heading
      description: >-
        Optional. Turn to face this heading after arriving. Leave unset to
        arrive without caring which way the vacuum faces.
      selector:
        number:
          min: 0
          max: 359
          unit_of_measurement: "°"
    heading_tolerance:
      name: Heading tolerance
      description: How close the final heading must be, in degrees.
      default: 1
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: "°"
    arrival_tolerance:
      name: Arrival tolerance
      description: How close in millimetres counts as arrived.
      default: 250
      selector:
        number:
          min: 50
          max: 2000
          unit_of_measurement: mm
    timeout:
      name: Timeout
      description: Give up and raise an error after this long.
      default: 180
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: s

remote_control:
  name: Remote control (raw)
  description: >-
    Send a raw drive command, for testing and calibration. Mirrors the app's
    live-view buttons: rotation is an angular velocity in degrees per second
    and velocity is forward speed in mm/s - neither is a distance.
  target:
    entity:
      integration: dreame_vacuum_core
      domain: vacuum
  fields:
    rotation:
      name: Rotation
      description: >-
        Angular velocity. The app's live view uses 45 / -45; its remote control
        page uses 120 / -120. Zero stops turning.
      default: 0
      selector:
        number:
          min: -360
          max: 360
    velocity:
      name: Velocity
      description: >-
        Forward speed in mm/s. The app uses 200 in the live view, 300 on the
        remote page. Zero stops.
      default: 0
      selector:
        number:
          min: -400
          max: 400
    duration:
      name: Duration
      description: >-
        Seconds to hold the command before sending a stop, resending at 1Hz as
        the app does. Leave at 0 to send one command and leave it running -
        the robot will keep going until you send zeros.
      default: 0
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s
