rotate_to_heading:
  name: Rotate to heading
  description: >-
    Turn the vacuum on the spot until it faces a given compass heading. Runs a
    closed loop - the device only accepts relative nudges and overshoots them,
    so this measures, corrects and repeats until it is within tolerance.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    heading:
      name: Heading
      description: Target heading in degrees.
      required: true
      selector:
        number:
          min: 0
          max: 359
          unit_of_measurement: "°"
    tolerance:
      name: Tolerance
      description: How close counts as arrived, in degrees.
      default: 1
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: "°"
    max_attempts:
      name: Maximum attempts
      description: Give up after this many corrections and raise an error.
      default: 10
      selector:
        number:
          min: 1
          max: 20
    damping:
      name: Damping
      description: >-
        Fraction of the remaining error to correct each step. Each step costs
        the better part of a minute waiting for the heading to settle, so
        higher is faster; too high oscillates around the target.
      default: 0.85
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.05
    settle:
      name: Settle time
      description: >-
        Seconds to wait after each nudge before measuring. The robot turns at
        its own pace, so measuring too early reads a heading it has already
        left. Scaled up automatically for larger turns.
      default: 4
      selector:
        number:
          min: 0
          max: 15
          unit_of_measurement: s
    camera_settle:
      name: Camera settle time
      description: >-
        Seconds to wait after opening the camera session before turning. The
        device needs a moment before it stops treating the turn as cleaning;
        around three seconds was where it started working. Default 3.5.
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          unit_of_measurement: s
    use_camera_session:
      name: Open a camera session
      description: >-
        Turn off when a stream is already running. The vacuum allows one
        camera session at a time, so opening a second would be refused and
        the turn would run the brushes.
      default: true
      selector:
        boolean:
    quiet:
      name: Quiet the vacuum
      description: >-
        Turn suction and water down to their minimum for the turn, then put
        them back. The firmware treats remote driving as a cleaning mode, so
        the brushes cannot be switched off outright - only turned down.
      default: true
      selector:
        boolean:

go_to_point:
  name: Go to point
  description: >-
    Drive to a coordinate on the current map, optionally finishing on a given
    heading. Coordinates are millimetres in the map's own frame of reference
    and are only valid for the map they were read from - check map_id.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    x:
      name: X
      description: Target X in millimetres, as reported by position_x.
      required: true
      selector:
        number:
          min: -20000
          max: 20000
          mode: box
    y:
      name: Y
      description: Target Y in millimetres, as reported by position_y.
      required: true
      selector:
        number:
          min: -20000
          max: 20000
          mode: box
    heading:
      name: Heading
      description: >-
        Optional. Turn to face this heading after arriving. Leave unset to
        arrive without caring which way the vacuum faces.
      selector:
        number:
          min: 0
          max: 359
          unit_of_measurement: "°"
    heading_tolerance:
      name: Heading tolerance
      description: How close the final heading must be, in degrees.
      default: 1
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: "°"
    arrival_tolerance:
      name: Arrival tolerance
      description: >-
        How close in millimetres counts as arrived. The robot parks
        approximately, so very tight values may never be met and the service
        will time out instead.
      default: 250
      selector:
        number:
          min: 1
          max: 2000
          unit_of_measurement: mm
    timeout:
      name: Timeout
      description: Give up and raise an error after this long.
      default: 180
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: s
    use_camera_session:
      name: Open a camera session
      description: >-
        Turn off when a stream is already running - the vacuum allows one
        camera session at a time. Only affects the heading step.
      default: true
      selector:
        boolean:

remote_control:
  name: Remote control (raw)
  description: >-
    Send a raw drive command, for testing and calibration. Mirrors the app's
    live-view buttons: rotation is an angular velocity in degrees per second
    and velocity is forward speed in mm/s - neither is a distance.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    rotation:
      name: Rotation
      description: >-
        Angular velocity. The app's live view uses 45 / -45; its remote control
        page uses 120 / -120. Zero stops turning.
      default: 0
      selector:
        number:
          min: -360
          max: 360
    velocity:
      name: Velocity
      description: >-
        Forward speed in mm/s. The app uses 200 in the live view, 300 on the
        remote page. Zero stops.
      default: 0
      selector:
        number:
          min: -400
          max: 400
    silent:
      name: Silent
      description: >-
        Open a camera session around the move. Without one the firmware treats
        driving as cleaning and runs the brushes and mop. Costs a few seconds
        of setup and needs the camera PIN configured.
      default: true
      selector:
        boolean:
    duration:
      name: Duration
      description: >-
        Seconds to hold the command before sending a stop, resending at 1Hz as
        the app does. Leave at 0 to send one command and leave it running -
        the robot will keep going until you send zeros.
      default: 0
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s

inspect_point:
  name: Inspect a point
  description: >-
    Drive somewhere, face a heading, photograph it and come back. Holds one
    camera stream open for the whole run, which keeps the turn silent and
    means the photo comes from the live feed rather than a stale snapshot.
    Returns what happened, so a script can report a partial success.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    x:
      name: X
      description: Target X in millimetres, as reported by position_x.
      required: true
      selector:
        number: {min: -20000, max: 20000, mode: box}
    "y":
      name: Y
      description: Target Y in millimetres, as reported by position_y.
      required: true
      selector:
        number: {min: -20000, max: 20000, mode: box}
    heading:
      name: Heading
      description: Optional. Turn to face this after arriving.
      selector:
        number: {min: 0, max: 359, unit_of_measurement: "°"}
    tag:
      name: Tag
      description: >-
        Groups snapshots in the media folder, for example poop_check. Saved as
        snapshots/<tag>/<timestamp>.jpg with a latest.jpg alongside.
        Defaults to general.
      example: poop_check
      selector:
        text:
    filename:
      name: Also copy photo to
      description: >-
        Optional extra copy, for somewhere Home Assistant serves over HTTP.
      selector:
        text:
    arrival_tolerance:
      name: Arrival tolerance
      description: How close in millimetres counts as arrived.
      default: 250
      selector:
        number: {min: 1, max: 2000, unit_of_measurement: mm}
    heading_tolerance:
      name: Heading tolerance
      description: How close the final heading must be, in degrees.
      default: 5
      selector:
        number: {min: 1, max: 30, unit_of_measurement: "°"}
    timeout:
      name: Timeout
      description: Give up driving after this long.
      default: 180
      selector:
        number: {min: 10, max: 600, unit_of_measurement: s}
    return_to_dock:
      name: Return to dock
      description: Send the vacuum home when finished.
      default: true
      selector:
        boolean:
    use_stream:
      name: Use a stream
      description: >-
        Hold one camera stream open for the whole errand. Turn off to let each
        step open its own short camera session instead - the photo still needs
        one either way.
      default: true
      selector:
        boolean:
    stop_stream:
      name: Stop the stream afterwards
      description: >-
        Turn off to leave the stream running when finished, for instance when
        several errands run back to back. A stream that was already running is
        always left alone.
      default: true
      selector:
        boolean:

take_snapshot:
  name: Take a snapshot
  description: >-
    Photograph what the vacuum is looking at now. Uses a running stream if
    there is one, since a capture that has to open its own camera session
    competes with anything else holding one.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    tag:
      name: Tag
      description: >-
        Groups snapshots in the media folder, for example poop_check. Saved as
        snapshots/<tag>/<timestamp>.jpg with a latest.jpg alongside.
        Defaults to general.
      example: poop_check
      selector:
        text:
    filename:
      name: Also copy to
      description: >-
        Optional extra copy, for somewhere Home Assistant serves over HTTP -
        for example /config/www/checks/latest.jpg. The folder is created if
        missing.
      selector:
        text:

start_task:
  name: Start a task
  description: >-
    Run a task defined in the companion add-on, by its id. Tasks are authored
    in the add-on's Tasks tab; this is how an automation triggers one.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    task:
      name: Task
      description: >-
        The task's id, as shown in the add-on's Tasks tab, for example
        poop_check. A task belongs to one vacuum and will not run on another.
      required: true
      example: poop_check
      selector:
        text:

clean_rooms:
  name: Clean rooms
  description: >-
    Clean a chosen set of rooms in the order their ids are listed. Mirrors the
    phone app's room-cleaning mode: the vacuum visits each room in the order
    given, so the list order is the cleaning order.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: >-
        Room (segment) ids to clean, in the order they should be cleaned.
        The same ids the live map reports under room_names.
      required: true
      selector:
        object:
    times:
      name: Times
      description: How many times to clean each room.
      default: 1
      selector:
        number:
          min: 1
          max: 5

publish_map:
  name: Publish the map
  description: >-
    Render the vacuum's current map and send it to the companion add-on, where
    it is used to pick coordinates. Called by the add-on when you open the map
    picker; you should not normally need to run it yourself.
  target:
    entity:
      integration: dreame_vacuum_unlocked_integration
      domain: vacuum
  fields:
    scale:
      name: Scale
      description: Screen pixels per map cell. Higher is larger and sharper.
      default: 5
      selector:
        number:
          min: 1
          max: 12
